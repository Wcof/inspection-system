name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - codex/inspection-business-logic-refactor
      - feature/third-party-task-sync
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout Branch Site
        uses: actions/checkout@v4
        with:
          ref: codex/inspection-business-logic-refactor
          path: branch-site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            branch-site/package-lock.json

      - name: Install Main Dependencies
        working-directory: main-site
        run: npm ci

      - name: Build Main Pages Routes
        working-directory: main-site
        run: |
          npm run build
          mv dist dist-v1
          VITE_BASE_PATH="/inspection-system/v2/" npm run build
          mv dist dist-v2
          mkdir -p dist/v2
          cp -R dist-v1/. dist/
          cp -R dist-v2/. dist/v2/
        env:
          GITHUB_PAGES: "true"

      - name: Install Branch Dependencies
        working-directory: branch-site
        run: npm ci

      - name: Build Branch Pages Route
        working-directory: branch-site
        run: |
          VITE_BASE_PATH="/inspection-system/codex/inspection-business-logic-refactor/" npm run build
          mkdir -p ../main-site/dist/codex/inspection-business-logic-refactor
          cp -R dist/. ../main-site/dist/codex/inspection-business-logic-refactor/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
